services:
  backend:
    image: ecommerce-backend:v1
    ports:
      - "8081:8080"
    environment:
      DB_HOST: database
      DB_PORT: "5432"
      DB_NAME: ecommerce
      DB_USERNAME: ecommerce
      # Local development only. Do not use this password in production.
      DB_PASSWORD: ecommerce-dev-password
      DB_DDL_AUTO: update
    depends_on:
      database:
        condition: service_healthy
    networks:
      - ecommerce-network

  database:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      # Must match the backend's local development password above.
      POSTGRES_PASSWORD: ecommerce-dev-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ecommerce-network

volumes:
  postgres-data:

networks:
  ecommerce-network:
    driver: bridge
